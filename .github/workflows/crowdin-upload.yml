name: Upload source files to Crowdin

on:
  push:
    branches: [ master ]
    paths:
      - 'manual/nitrofiles/languages/en/**'
      - 'quickmenu/nitrofiles/languages/en/**'
      - 'romsel_dsimenutheme/nitrofiles/languages/en/*'
      - 'settings/nitrofiles/languages/en/*'
      - 'title/nitrofiles/languages/en/*'
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'DS-Homebrew/TWiLightMenu' || vars.ENABLE_CROWDIN == 'true'
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.24.0

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup environment
        run: git config --global safe.directory '*'

      - name: Install tools
        run: |
          apt-get update
          apt-get install python3 g++ -y

      - name: Build TWiLightMenu++
        run: |
          make package

      - name: Push to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
        env:
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
